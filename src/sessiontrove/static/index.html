<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sessiontrove</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/static/viewer.css">
</head>
<body>
<aside id="sidebar">
  <header>
    <h1 id="logo">sessiontrove</h1>
    <input id="search" type="search" placeholder="search" autocomplete="off">
  </header>
  <ul id="session-list"></ul>
</aside>
<main id="main">
  <p id="placeholder">Select a session.</p>
  <section id="session" hidden>
    <header id="meta"></header>
    <div id="controls">
      <button id="toggle-expand" title="expand everything (e)">expand all</button>
    </div>
    <details id="branches" hidden>
      <summary id="branches-summary">branches</summary>
      <p id="branches-hint">
        Points where an edited message split the conversation.
        The marked path is the one shown below; click a row to switch.
      </p>
      <div id="branches-body"></div>
    </details>
    <div id="conversation"></div>
  </section>
</main>
<script src="/static/viewer.js"></script>
</body>
</html>
